<!DOCTYPE html>
<html>
  <head>

<script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@2.1.1/dist/aframe-extras.min.js"></script>


  </head>
    <body>
    <a-scene>
      <a-sky color="lightblue"></a-sky>
     
      <a-entity
      ply-model="src:dog.ply"
      position="0 -1.5 -3"
      rotation="270 0 90"
      ></a-entity>
                 
      <a-entity
      ply-model="src:dog house.ply"
      position="-2 -1 -1"
      rotation="270 0 0"
      ></a-entity>

      <a-entity
      ply-model="src:cloud.ply"
      position="-4 20 -20"
      rotation="90 90 90"
        animation="
                    property:position;
                    from:-12 20 -20;
                    to:4 20 -20;
                    dur:20000;
                    loop:true;
                    dir:alternate
                    "
      ></a-entity>
    </a-scene>
  </body>
</html>
